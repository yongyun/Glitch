        ctx.restore();
    }
}

let letters = [];
let lastText = '';
let wordPhysics = { x: 0, y: 0, vx: 2, vy: 2, rotation: 0, va: 0.02 };
let mousePos = { x: 0, y: 0 };
let globalTime = 0;
let customFontFamily = null;
let bgImg = null;
let bgImgLoaded = false;
let draggedLetter = null;
let isDragging = false;
let letterOffsets = {}; // Per-letter manual offsets keyed by index

// Handle background image upload
controls.onChange('bgImage', (imgUrl) => {
    if (!imgUrl) {
        bgImg = null;
        bgImgLoaded = false;
        return;
    }
    const img = new Image();
    img.onload = () => {
        bgImg = img;
        bgImgLoaded = true;
    };
    img.src = imgUrl;
});

// Load initial background image if set
(function() {
    const initialBg = controls.get('bgImage');
    if (initialBg) {
        const img = new Image();
        img.onload = () => {
            bgImg = img;
            bgImgLoaded = true;
        };
        img.src = initialBg;
    }
})();

// Handle custom font upload
controls.onChange('customFont', (fontDataUrl) => {
    if (!fontDataUrl) return;
    const fontName = 'CustomUploadedFont_' + Date.now();
    const fontFace = new FontFace(fontName, `url(${fontDataUrl})`);
    fontFace.load().then((loaded) => {
        document.fonts.add(loaded);
        customFontFamily = fontName;
        initLetters();
    }).catch(err => {
        console.warn('Font load failed:', err);
    });
});

// When user picks a font from the selector, clear custom font override
controls.onChange('fontFamily', () => {
    customFontFamily = null;
});

function initLetters() {
    const text = controls.get('textContent') || '';
    const fontSize = controls.get('fontSize');
    const spacing = controls.get('letterSpacing') || 0.6;
    const w = canvas.width;
    const h = canvas.height;

    if (w === 0 || h === 0) return;

    globalTime = 0; // Reset global time for wave/breathe
    letters = [];
    const chars = text.split('');
    const charWidth = fontSize * spacing;
    const totalWidth = chars.length * charWidth;

    wordPhysics.x = w / 2;
    wordPhysics.y = h / 2;
    wordPhysics.rotation = 0;

    if (wordPhysics.vx === 0) wordPhysics.vx = 2;
    if (wordPhysics.vy === 0) wordPhysics.vy = 2;

    const centerX = w / 2;
    const centerY = h / 2;

    chars.forEach((char, i) => {
        const offsetX = (i * charWidth) - (totalWidth / 2) + (charWidth / 2);
        const x = wordPhysics.x + offsetX;
        const y = wordPhysics.y;
        const startX = centerX + offsetX;
        const startY = centerY;
        const l = new Letter(char, x, y, fontSize, offsetX, startX, startY);
        l.index = i;
        // Apply stored manual offsets if they exist
        if (letterOffsets[i]) {
            l.freeX = startX + letterOffsets[i].x;
            l.freeY = startY + letterOffsets[i].y;
            l.x = l.freeX;
            l.y = l.freeY;
        }
        for(let j=0; j<200; j++) l.history.push({ x: l.x, y: l.y, rotation: 0 });
        letters.push(l);
    });

    lastText = text;
}

function resolveCollisions() {
    for (let i = 0; i < letters.length; i++) {
        for (let j = i + 1; j < letters.length; j++) {
            const l1 = letters[i];
            const l2 = letters[j];

            const dx = l2.freeX - l1.freeX;
            const dy = l2.freeY - l1.freeY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const minDistance = l1.radius + l2.radius;

            if (distance < minDistance) {
                const overlap = minDistance - distance;
                const nx = dx / (distance || 1);
                const ny = dy / (distance || 1);

                const moveX = nx * overlap * 0.5;
                const moveY = ny * overlap * 0.5;

                l1.freeX -= moveX;
                l1.freeY -= moveY;
                l2.freeX += moveX;
                l2.freeY += moveY;

                const relativeVx = l2.vx - l1.vx;
                const relativeVy = l2.vy - l1.vy;
                const velocityAlongNormal = relativeVx * nx + relativeVy * ny;

                if (velocityAlongNormal < 0) {
                    const restitution = 0.8;
                    const impulse = -(1 + restitution) * velocityAlongNormal;
                    const impulseX = impulse * nx * 0.5;
                    const impulseY = impulse * ny * 0.5;

                    l1.vx -= impulseX;
                    l1.vy -= impulseY;
                    l2.vx += impulseX;
                    l2.vy += impulseY;
                }
            }
        }
    }
}

function updateWord(w, h, speedMult, rotMult, breakFactor, animStyle) {
    const fontSize = controls.get('fontSize');

    wordPhysics.x += wordPhysics.vx * speedMult;
    wordPhysics.y += wordPhysics.vy * speedMult;
    wordPhysics.rotation += wordPhysics.va * rotMult * 10;

    const cos = Math.cos(wordPhysics.rotation);
    const sin = Math.sin(wordPhysics.rotation);

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const padding = fontSize * 0.5;

    letters.forEach(letter => {
        const wx = wordPhysics.x + letter.offsetX * cos;
        const wy = wordPhysics.y + letter.offsetX * sin;
        letter.wordX = wx;
        letter.wordY = wy;
        letter.wordRotation = wordPhysics.rotation;

        minX = Math.min(minX, wx);
        maxX = Math.max(maxX, wx);
        minY = Math.min(minY, wy);
        maxY = Math.max(maxY, wy);
    });

    if (minX < padding) {
        wordPhysics.vx = Math.abs(wordPhysics.vx);
        wordPhysics.x += (padding - minX);
    } else if (maxX > w - padding) {
        wordPhysics.vx = -Math.abs(wordPhysics.vx);
        wordPhysics.x -= (maxX - (w - padding));
    }

    if (minY < padding) {
        wordPhysics.vy = Math.abs(wordPhysics.vy);
        wordPhysics.y += (padding - minY);
    } else if (maxY > h - padding) {
        wordPhysics.vy = -Math.abs(wordPhysics.vy);
        wordPhysics.y -= (maxY - (h - padding));
    }

    if (breakFactor > 0 && controls.get('collisionEnabled')) {
        resolveCollisions();
    }

    letters.forEach(letter => {
        letter.update(w, h, speedMult, rotMult, breakFactor, animStyle, globalTime);
    });
}

function hexToRgba(hex, opacity) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${opacity / 100})`;
}

let lastFontSize = 0;
let lastSpacing = 0;

function draw() {
    const isAnimated = controls.get('animate');
    const w = canvas.width;
    const h = canvas.height;

    if (letters.length === 0 && w > 0) {
        initLetters();
    }

    const breakFactor = controls.get('breakApart') / 100;
    const currentFontSize = controls.get('fontSize');
    const currentSpacing = controls.get('letterSpacing');

    if (controls.get('textContent') !== lastText || currentFontSize !== lastFontSize || currentSpacing !== lastSpacing) {
        lastFontSize = currentFontSize;
        lastSpacing = currentSpacing;
        initLetters();
    }

    ctx.clearRect(0, 0, w, h);

    // Draw background image with cover mode (no edges, full bleed)
    if (bgImgLoaded && bgImg) {
        CanvasRuntimeAPI.drawImage(ctx, bgImg, 0, 0, w, h, 'cover');
    }

    const fontObj = controls.get('fontFamily');
    const fontSize = controls.get('fontSize');
    const activeFontFamily = customFontFamily || fontObj.family;
    const fontStr = `${fontObj.weight} ${fontSize}px "${activeFontFamily}", sans-serif`;

    const floatSpeed = controls.get('floatSpeed');
    const rotSpeed = controls.get('rotationSpeed');
    const echoCount = controls.get('echoCount');
    const echoDelay = controls.get('echoDelay');
    const echoOpacity = controls.get('echoOpacity');

    const fillColor = controls.get('fillColor');
    const fillOpacity = controls.get('fillOpacity');
    const strokeColor = controls.get('strokeColor');
    const strokeWidth = controls.get('strokeWidth');

    const mainFill = hexToRgba(fillColor, fillOpacity);
    const mainStroke = hexToRgba(strokeColor, 100);
    const echoFill = hexToRgba(fillColor, echoOpacity);
    const echoStroke = hexToRgba(strokeColor, echoOpacity);

    const echoScale = controls.get('echoScale') || 1.0;

    const animStyle = controls.get('animStyle') || 'drift';

    if (isAnimated) {
        globalTime += 0.016;
        updateWord(w, h, floatSpeed, rotSpeed, breakFactor, animStyle);
    }

    for (let i = echoCount; i >= 1; i--) {
        const index = i * echoDelay;
        const s = Math.pow(echoScale, i);

        letters.forEach(letter => {
            if (letter.history[index]) {
                const state = letter.history[index];
                letter.draw(ctx, state.x, state.y, state.rotation, s, fontStr, echoFill, echoStroke, strokeWidth);
            }
        });
    }

    letters.forEach(letter => {
        letter.draw(ctx, letter.x, letter.y, letter.rotation, 1, fontStr, mainFill, mainStroke, strokeWidth);
    });

    requestAnimationFrame(draw);
}

canvas.addEventListener('mousemove', (e) => {
    mousePos = CanvasRuntimeAPI.getMousePos(e);
    if (isDragging && draggedLetter !== null) {
        const letter = letters[draggedLetter];
        if (letter) {
            const idx = draggedLetter;
            if (!letterOffsets[idx]) letterOffsets[idx] = { x: 0, y: 0 };
            letter.freeX = mousePos.x;
            letter.freeY = mousePos.y;
            letter.x = mousePos.x;
            letter.y = mousePos.y;
            letter.vx = 0;
            letter.vy = 0;
            letterOffsets[idx].x = mousePos.x - letter.wordX;
            letterOffsets[idx].y = mousePos.y - letter.wordY;
        }
    }
});

canvas.addEventListener('mousedown', (e) => {
    const pos = CanvasRuntimeAPI.getMousePos(e);
    const fontSize = controls.get('fontSize');
    const hitRadius = fontSize * 0.5;
    // Find closest letter to click
    let closestIdx = -1;
    let closestDist = Infinity;
    letters.forEach((letter, i) => {
        const dx = pos.x - letter.x;
        const dy = pos.y - letter.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < hitRadius && dist < closestDist) {
            closestDist = dist;
            closestIdx = i;
        }
    });
    if (closestIdx >= 0) {
        isDragging = true;
        draggedLetter = closestIdx;
        // Pause animation while dragging
    }
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
    draggedLetter = null;
});

canvas.addEventListener('mouseleave', () => {
    isDragging = false;
    draggedLetter = null;
});

// Touch support for dragging letters — only block page scrolling when a
// letter is actually grabbed, so swiping elsewhere still scrolls the page.
canvas.addEventListener('touchstart', (e) => {
    const pos = CanvasRuntimeAPI.getMousePos(e);
    const fontSize = controls.get('fontSize');
    const hitRadius = fontSize * 0.5;
    let closestIdx = -1;
    let closestDist = Infinity;
    letters.forEach((letter, i) => {
        const dx = pos.x - letter.x;
        const dy = pos.y - letter.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < hitRadius && dist < closestDist) {
            closestDist = dist;
            closestIdx = i;
        }
    });
    if (closestIdx >= 0) {
        e.preventDefault();
        isDragging = true;
        draggedLetter = closestIdx;
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    const pos = CanvasRuntimeAPI.getMousePos(e);
    mousePos = pos;
    if (isDragging && draggedLetter !== null) {
        e.preventDefault();
        const letter = letters[draggedLetter];
        if (letter) {
            const idx = draggedLetter;
            if (!letterOffsets[idx]) letterOffsets[idx] = { x: 0, y: 0 };
            letter.freeX = pos.x;
            letter.freeY = pos.y;
            letter.x = pos.x;
            letter.y = pos.y;
            letter.vx = 0;
            letter.vy = 0;
            letterOffsets[idx].x = pos.x - letter.wordX;
            letterOffsets[idx].y = pos.y - letter.wordY;
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', () => {
    isDragging = false;
    draggedLetter = null;
});

controls.onAction('backToStart', () => {
    initLetters();
    controls.set('animate', false);
});

controls.onAction('resetAnimation', () => {
    initLetters();
    controls.set('breakApart', 0);
});

initLetters();
requestAnimationFrame(draw);

window.addEventListener('resize', () => {
    initLetters();
});

      var __sysBgVal = controls.get('__sys_bg');
      if (__sysBgVal) CanvasRuntimeAPI.setBackground(__sysBgVal);

  </script>
  <script>
    (function() {
      if (!document.fonts || !document.fonts.load) return;
      var _fams = ["Arial"];
      var _replay = function() {
        var _api = window.ControlsAPI;
        if (!_api || !_api.getAll || !_api.set) return;
        var _all = _api.getAll();
        Object.keys(_all).forEach(function(k) { _api.set(k, _all[k]); });
      };
      Promise.all(_fams.map(function(f) {
        return document.fonts.load('1em "' + f + '"').catch(function() {});
      })).then(_replay);
      // The sheet can still be in flight when the promises settle empty; a late sweep costs
      // one extra repaint and covers a slow CDN.
      setTimeout(_replay, 2500);
    })();
  </script>
