        if (dist < hitRadius && dist < closestDist) {

            closestIdx = i;
        }

        draggedLetter = closestIdx;

    }

canvas.addEventListener('mouseup', () => {
    isDragging = false;
    draggedLetter = null;
});

canvas.addEventListener('mouseleave', () => {
    isDragging = false;
    draggedLetter = null;
});

// Touch support for dragging letters
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const pos = CanvasRuntimeAPI.getMousePos(e);
    const fontSize = controls.get('fontSize');
    const hitRadius = fontSize * 0.5;
    let closestIdx = -1;
    let closestDist = Infinity;
    letters.forEach((letter, i) => {
        const dx = pos.x - letter.x;
        const dy = pos.y - letter.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < hitRadius && dist < closestDist) {
            closestDist = dist;
            closestIdx = i;
        }
    });
    if (closestIdx >= 0) {
        isDragging = true;
        draggedLetter = closestIdx;
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const pos = CanvasRuntimeAPI.getMousePos(e);
    mousePos = pos;
    if (isDragging && draggedLetter !== null) {
        const letter = letters[draggedLetter];
        if (letter) {
            const idx = draggedLetter;
            if (!letterOffsets[idx]) letterOffsets[idx] = { x: 0, y: 0 };
            letter.freeX = pos.x;
            letter.freeY = pos.y;
            letter.x = pos.x;
            letter.y = pos.y;
            letter.vx = 0;
            letter.vy = 0;
            letterOffsets[idx].x = pos.x - letter.wordX;
            letterOffsets[idx].y = pos.y - letter.wordY;
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', () => {
    isDragging = false;
    draggedLetter = null;
});

controls.onAction('backToStart', () => {
    initLetters();
    controls.set('animate', false);
});

controls.onAction('resetAnimation', () => {
    initLetters();
    controls.set('breakApart', 0);
});

initLetters();
requestAnimationFrame(draw);

window.addEventListener('resize', () => {
